<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Rhythm Sync</title>
    <style>
        /* Global Dark Mode Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #f8fafc;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.05s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-record { background-color: #ef4444; color: white; }
        .btn-record.recording { background-color: #b91c1c; animation: pulse 1.5s infinite; }
        
        /* Fast-response performance coloring for Play */
        .btn-play { background-color: #0ea5e9; color: white; }
        .btn-play:active { background-color: #0284c7; }
        .btn-play:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        
        /* Interactive Tap Zone */
        .tap-zone {
            width: 100%;
            height: 150px;
            background-color: #1e293b;
            border: 3px dashed #475569;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
            margin-bottom: 25px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .tap-zone:active {
            background-color: #334155;
            border-color: #64748b;
        }

        /* High-contrast Display Arena */
        .display-box {
            min-height: 120px;
            background: #0f172a;
            color: #38bdf8;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: bold;
            padding: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .status-text {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chinese Rhythm Sync</h1>

    <div class="input-group">
        <label for="sentenceInput">Enter words separated by spaces:</label>
        <input type="text" id="sentenceInput" value="父母 给予 我 极大的 支持。">
    </div>

    <div class="controls">
        <button id="recordBtn" class="btn-record">Start Recording</button>
        <button id="playBtn" class="btn-play" disabled>Play Rhythm</button>
    </div>

    <div id="tapZone" class="tap-zone">
        Tap here to set the rhythm!
    </div>

    <div id="displayBox" class="display-box">
        ...
    </div>
    
    <div id="status" class="status-text">Ready.</div>
</div>

<script>
    // App State
    let words = [];
    let recordedTimestamps = [];
    let isRecording = false;
    let currentIdx = 0;
    let startTime = 0;
    let playbackTimeoutIds = [];

    // DOM Elements
    const sentenceInput = document.getElementById('sentenceInput');
    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const tapZone = document.getElementById('tapZone');
    const displayBox = document.getElementById('displayBox');
    const statusText = document.getElementById('status');

    // Parse items by spaces instead of individual characters
    function parseSentence() {
        const text = sentenceInput.value.trim();
        // Split by one or more spaces
        words = text.split(/\s+/).filter(word => word !== "");
        return words;
    }

    // Start/Prepare recording sequence
    recordBtn.addEventListener('click', () => {
        parseSentence();
        if (words.length === 0) {
            alert("Please input space-separated words first!");
            return;
        }

        clearPlayback();

        isRecording = true;
        recordedTimestamps = [];
        currentIdx = 0;
        startTime = performance.now();
        
        recordBtn.textContent = "Recording...";
        recordBtn.classList.add('recording');
        playBtn.disabled = true;
        
        displayBox.textContent = "ーー";
        statusText.textContent = `Tap match rhythm! Word 1 / ${words.length}`;
        tapZone.textContent = `TAP NOW for: ${words[0]}`;
    });

    // Handle Tap input
    tapZone.addEventListener('pointerdown', (e) => {
        if (!isRecording) return;
        e.preventDefault(); 

        const currentTapTime = performance.now() - startTime;
        
        if (currentIdx < words.length) {
            // Save relative millisecond timestamp for the whole word cluster
            recordedTimestamps.push({
                word: words[currentIdx],
                timeOffset: currentTapTime
            });

            // Flash the word instantly
            displayBox.textContent = words[currentIdx];
            
            currentIdx++;

            if (currentIdx < words.length) {
                statusText.textContent = `Recorded ${currentIdx} / ${words.length}`;
                tapZone.textContent = `TAP NOW for: ${words[currentIdx]}`;
            } else {
                // End Recording session
                isRecording = false;
                recordBtn.textContent = "Start Recording";
                recordBtn.classList.remove('recording');
                playBtn.disabled = false;
                tapZone.textContent = "Rhythm Saved!";
                statusText.textContent = "Ready for manual playback.";
            }
        }
    });

    // Rapid Manual Playback Launch
    playBtn.addEventListener('click', () => {
        if (recordedTimestamps.length === 0) return;
        
        // Wipe clean previous unfinished timers instantly
        clearPlayback();
        
        statusText.textContent = "Playing...";
        
        // Zero out the display box immediately upon execution
        displayBox.textContent = "ーー"; 

        // Execute the single run sequence
        recordedTimestamps.forEach((stamp) => {
            let id = setTimeout(() => {
                displayBox.textContent = stamp.word;
            }, stamp.timeOffset);
            
            playbackTimeoutIds.push(id);
        });
    });

    function clearPlayback() {
        playbackTimeoutIds.forEach(id => clearTimeout(id));
        playbackTimeoutIds = [];
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Rhythm Sync</title>
    <style>
        /* Base Dark Mode Settings for Samsung S22 Ultra */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 32px);
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin: 0 0 15px 0;
            color: #f1f5f9;
        }

        /* View Switching Logic */
        .app-view {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .app-view.active {
            display: flex;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #f8fafc;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        /* Setup View Sentence Preview styling */
        .sentence-preview {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .preview-word {
            font-size: 1.4rem;
            font-weight: bold;
            color: #475569;
            transition: color 0.05s ease;
        }

        .preview-word.active {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* Tap Capture Area */
        .tap-zone {
            width: 100%;
            flex-grow: 1;
            min-height: 180px;
            background-color: #1e293b;
            border: 3px dashed #475569;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            user-select: none;
            margin-bottom: 20px;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .tap-zone:active {
            background-color: #334155;
            border-color: #64748b;
        }

        /* VIEW 2: Focus View UI Layout */
        .focus-box {
            width: 100%;
            height: 180px;
            background: #0f172a;
            color: #38bdf8;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.2rem; /* Massive typography layout */
            font-weight: bold;
            padding: 15px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Notes Window Textarea Component */
        .notes-window {
            width: 100%;
            flex-grow: 1;
            min-height: 140px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        .notes-window:focus {
            border-color: #38bdf8;
        }

        /* Navigation & Dashboard Actions Grouping */
        .controls-container {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 15px 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.1s;
            touch-action: manipulation;
        }

        button:active {
            opacity: 0.8;
        }

        #recordBtn { background-color: #ef4444; }
        #recordBtn.ready-to-tap { background-color: #f59e0b; animation: pulse 1.5s infinite; }
        #recordBtn.recording { background-color: #b91c1c; }
        
        #playBtn, #focusPlayBtn { background-color: #0ea5e9; }
        #playBtn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }

        #toFocusViewBtn { background-color: #8b5cf6; } /* Purple navigation asset */
        #toFocusViewBtn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        
        #toSetupViewBtn { background-color: #64748b; }
        #retryBtn { background-color: #475569; }

        .status-text {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="setupView" class="app-view active">
        <h1>Chinese Rhythm Sync</h1>
        
        <div class="input-group">
            <label for="sentenceInput">Enter words separated by spaces:</label>
            <input type="text" id="sentenceInput" value="父母 给予 我 极大的 支持。">
        </div>

        <div id="sentencePreview" class="sentence-preview"></div>

        <div id="tapZone" class="tap-zone">
            Tap here to set the rhythm!
        </div>

        <div class="controls-container">
            <div class="grid-buttons">
                <button id="recordBtn">Start Recording</button>
                <button id="toFocusViewBtn" disabled>Go to Focus Mode →</button>
            </div>
            <div class="grid-buttons">
                <button id="playBtn" disabled>Test Rhythm</button>
                <button id="retryBtn">Clear / Reset</button>
            </div>
            <div id="statusSetup" class="status-text">Ready.</div>
        </div>
    </div>

    <div id="focusView" class="app-view">
        <h1>Focus Presentation Mode</h1>
        
        <div id="focusBox" class="focus-box">ーー</div>

        <label for="notesArea">Study Notes & Pinyin Window:</label>
        <textarea id="notesArea" class="notes-window" placeholder="Type structural notes, translations or custom feedback details here... (Autosaves)"></textarea>

        <div class="controls-container">
            <div class="grid-buttons">
                <button id="focusPlayBtn">Play Rhythm</button>
                <button id="toSetupViewBtn">← Back to Setup</button>
            </div>
            <div id="statusFocus" class="status-text">Ready to run script.</div>
        </div>
    </div>

</div>

<script>
    // System Configurations
    let words = [];
    let recordedTimestamps = [];
    let isArmed = false; 
    let isRecording = false;
    let currentIdx = 0;
    let startTime = 0;
    let playbackTimeoutIds = [];

    // DOM Selector Hub
    const setupView = document.getElementById('setupView');
    const focusView = document.getElementById('focusView');
    
    const sentenceInput = document.getElementById('sentenceInput');
    const sentencePreview = document.getElementById('sentencePreview');
    const notesArea = document.getElementById('notesArea');
    
    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const retryBtn = document.getElementById('retryBtn');
    const toFocusViewBtn = document.getElementById('toFocusViewBtn');
    
    const focusBox = document.getElementById('focusBox');
    const focusPlayBtn = document.getElementById('focusPlayBtn');
    const toSetupViewBtn = document.getElementById('toSetupViewBtn');
    
    const tapZone = document.getElementById('tapZone');
    const statusSetup = document.getElementById('statusSetup');
    const statusFocus = document.getElementById('statusFocus');

    // Parse sentence data structures
    function renderSentencePreview() {
        const text = sentenceInput.value.trim();
        words = text.split(/\s+/).filter(w => w !== "");
        
        sentencePreview.innerHTML = '';
        words.forEach((word, index) => {
            const span = document.createElement('span');
            span.className = 'preview-word';
            span.id = `word-${index}`;
            span.textContent = word;
            sentencePreview.appendChild(span);
        });

        localStorage.setItem('savedSentence', text);
    }

    function clearVisualHighlights() {
        document.querySelectorAll('.preview-word').forEach(span => span.classList.remove('active'));
    }

    // Arm System For Recording Action
    recordBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        renderSentencePreview();
        if (words.length === 0) return;

        clearPlayback();
        clearVisualHighlights();

        isArmed = true;
        isRecording = false;
        recordedTimestamps = [];
        currentIdx = 0;

        recordBtn.textContent = "Waiting for 1st Tap...";
        recordBtn.className = "ready-to-tap";
        playBtn.disabled = true;
        toFocusViewBtn.disabled = true;

        tapZone.textContent = `Tap to begin! First: ${words[0]}`;
        statusSetup.textContent = "Timer initiates automatically at first impact.";
    });

    // Primary Touch Panel Metrics Engine
    tapZone.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!isArmed && !isRecording) return;

        if (isArmed && !isRecording) {
            isArmed = false;
            isRecording = true;
            startTime = performance.now();
            recordBtn.textContent = "Recording...";
            recordBtn.className = "recording";
        }

        const currentTapTime = performance.now() - startTime;

        if (currentIdx < words.length) {
            recordedTimestamps.push({
                word: words[currentIdx],
                timeOffset: currentTapTime
            });

            clearVisualHighlights();
            const activeSpan = document.getElementById(`word-${currentIdx}`);
            if (activeSpan) activeSpan.classList.add('active');

            currentIdx++;

            if (currentIdx < words.length) {
                tapZone.textContent = `TAP NOW for: ${words[currentIdx]}`;
                statusSetup.textContent = `Logged ${currentIdx} / ${words.length}`;
            } else {
                // Auto-concludes automatically when hitting the index threshold limit
                finishRecording();
            }
        }
    });

    function finishRecording() {
        isArmed = false;
        isRecording = false;
        recordBtn.textContent = "Start Recording";
        recordBtn.className = "";
        
        if (recordedTimestamps.length > 0) {
            playBtn.disabled = false;
            toFocusViewBtn.disabled = false;
            localStorage.setItem('savedTimestamps', JSON.stringify(recordedTimestamps));
            tapZone.textContent = "Perfect! Rhythm Saved.";
            statusSetup.textContent = "Ready. Tap 'Go to Focus Mode' to study.";
        }
    }

    // Shared Execution Engine for Playback
    function executePlayback(displayTarget, statusTarget) {
        clearPlayback();
        statusTarget.textContent = "Playing rhythm structure...";
        displayTarget.textContent = "ーー";

        recordedTimestamps.forEach((stamp, index) => {
            let id = setTimeout(() => {
                displayTarget.textContent = stamp.word;
                
                // Clear state slightly past completion run
                if (index === recordedTimestamps.length - 1) {
                    let finishId = setTimeout(() => {
                        statusTarget.textContent = "Playback complete.";
                    }, 800);
                    playbackTimeoutIds.push(finishId);
                }
            }, stamp.timeOffset);

            playbackTimeoutIds.push(id);
        });
    }

    playBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        executePlayback(document.getElementById('focusBox'), statusSetup); // Temporarily flashes focus text space for confirmation checks
    });

    focusPlayBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        executePlayback(focusBox, statusFocus);
    });

    // View Navigation Switches
    toFocusViewBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        setupView.classList.remove('active');
        focusView.classList.add('active');
        focusBox.textContent = "ーー";
        statusFocus.textContent = "Ready to display rhythm loop.";
    });

    toSetupViewBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        focusView.classList.remove('active');
        setupView.classList.add('active');
        clearVisualHighlights();
    });

    // Storage Saving for Notes Window
    notesArea.addEventListener('input', () => {
        localStorage.setItem('savedNotes', notesArea.value);
    });

    // Wipe states
    retryBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        clearVisualHighlights();
        isArmed = false;
        isRecording = false;
        recordedTimestamps = [];
        currentIdx = 0;
        
        recordBtn.textContent = "Start Recording";
        recordBtn.className = "";
        playBtn.disabled = true;
        toFocusViewBtn.disabled = true;
        
        tapZone.textContent = "Tap here to set the rhythm!";
        statusSetup.textContent = "Reset tracking values complete.";
        renderSentencePreview();
    });

    function clearPlayback() {
        playbackTimeoutIds.forEach(id => clearTimeout(id));
        playbackTimeoutIds = [];
    }

    sentenceInput.addEventListener('input', renderSentencePreview);

    // Initialization Sequence
    window.addEventListener('DOMContentLoaded', () => {
        const storedSentence = localStorage.getItem('savedSentence');
        const storedTimestamps = localStorage.getItem('savedTimestamps');
        const savedNotes = localStorage.getItem('savedNotes');

        if (storedSentence) sentenceInput.value = storedSentence;
        if (savedNotes) notesArea.value = savedNotes;
        
        renderSentencePreview();

        if (storedTimestamps) {
            recordedTimestamps = JSON.parse(storedTimestamps);
            if (recordedTimestamps.length > 0) {
                playBtn.disabled = false;
                toFocusViewBtn.disabled = false;
                statusSetup.textContent = "Loaded last profile rhythm configurations safely.";
            }
        }
    });
</script>

</body>
</html>

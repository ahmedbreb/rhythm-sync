<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Rhythm Sync</title>
    <style>
        /* Base Settings Optimized for Samsung S22 Ultra Layouts */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px; 
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 16px); /* Maximize vertical height allocation */
            overflow: hidden; 
        }

        .container.immersive-active {
            max-width: 100%;
            background: #0f172a;
            padding: 10px;
            box-shadow: none;
            height: 100vh;
            border-radius: 0;
        }

        h1 {
            font-size: 1.1rem;
            text-align: center;
            margin: 0 0 6px 0;
            color: #f1f5f9;
        }

        .app-view {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden; 
        }

        .app-view.active {
            display: flex;
        }

        .input-group {
            margin-bottom: 6px;
        }

        .input-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 85px 8px 12px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #f8fafc;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .inline-actions {
            position: absolute;
            right: 6px;
            display: flex;
            gap: 4px;
        }

        .btn-inline {
            background-color: #334155;
            color: #94a3b8;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            min-width: 32px;
        }

        .btn-inline:active {
            background-color: #475569;
            color: #f8fafc;
        }

        /* Maximized Window: Increased to 220px to utilize empty space */
        .sentence-preview {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 12px 12px 120px 12px; /* Deep safety padding lets long final lines scroll up fully */
            margin-bottom: 8px;
            height: 220px; 
            max-height: 220px;
            overflow-y: auto; 
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-content: flex-start;
            scroll-behavior: smooth;
        }

        .preview-word {
            font-size: 1.15rem;
            font-weight: bold;
            color: #475569;
            transition: color 0.1s ease, background-color 0.1s ease;
            white-space: pre-wrap;
            text-align: center;
            line-height: 1.2;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .preview-word.active {
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.15);
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Repositioned & Enlarged Tap Zone: Placed right above buttons */
        .tap-zone {
            width: 100%;
            height: 76px; 
            min-height: 76px;
            background-color: #1e293b;
            border: 2px dashed #38bdf8;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
            color: #38bdf8;
            cursor: pointer;
            user-select: none;
            margin-top: auto; /* Pushes it down above the control panel */
            margin-bottom: 10px;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            touch-action: manipulation;
            white-space: pre-wrap;
            line-height: 1.3;
        }

        .tap-zone:active {
            background-color: #334155;
            border-color: #0ea5e9;
        }

        .focus-box {
            width: 100%;
            height: 150px;
            background: #0f172a;
            color: #38bdf8;
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-weight: bold;
            padding: 12px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            white-space: pre-wrap;
            line-height: 1.2;
            overflow: hidden;
        }

        .notes-window {
            width: 100%;
            flex-grow: 1;
            min-height: 80px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.4;
            resize: none;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 10px;
        }

        .immersive-top-nav {
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 10px 15px;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .faint-nav-btn {
            background: none;
            border: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 12px;
            cursor: pointer;
        }

        .fullscreen-tap-arena {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            cursor: pointer;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            box-sizing: border-box;
            padding: 40px;
            touch-action: manipulation;
        }

        .giant-display-text {
            font-size: 5rem;
            font-weight: 900;
            color: #38bdf8;
            text-align: center;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            pointer-events: none;
            white-space: pre-wrap;
            line-height: 1.15;
            width: 100%;
            word-wrap: break-word;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 0; 
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        button:not(.btn-inline) {
            padding: 10px; 
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.1s;
            touch-action: manipulation;
        }

        button:not(.btn-inline):active {
            opacity: 0.8;
        }

        #recordBtn { background-color: #ef4444; }
        #recordBtn.ready-to-tap { background-color: #f59e0b; animation: pulse 1.5s infinite; }
        #recordBtn.recording { background-color: #b91c1c; }
        
        #playBtn, #focusPlayBtn { background-color: #0ea5e9; }
        #playBtn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }

        #toFocusViewBtn, #toImmersiveViewBtn { background-color: #8b5cf6; } 
        #toFocusViewBtn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        
        #toSetupViewBtn { background-color: #64748b; }
        #retryBtn { background-color: #475569; }

        .status-text {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="mainContainer" class="container">
    
    <!-- VIEW 1: SETUP WINDOW -->
    <div id="setupView" class="app-view active">
        <h1>Chinese Rhythm Sync</h1>
        
        <div class="input-group">
            <div class="input-label-row">
                <label for="sentenceInput">Target Phrase Mapping Area:</label>
            </div>
            <div class="input-wrapper">
                <input type="text" id="sentenceInput" value="坐-公共汽车-时 不再 无聊, 因为 可以 找-个-靠窗的-位置 欣赏 街道上的-广告; 在-人行道-上 郁闷地 等待 红绿灯-时, 可以 看看 人行道-附近的-各种-公益-广告; 公共汽车 换上了 新装, 吃的、 喝的、 玩的、 用的, 什么-都-有, 吸引着 人们的-眼球.">
                <div class="inline-actions">
                    <button id="clearInputBtn" class="btn-inline" title="Clear Text">✕</button>
                    <button id="pasteInputBtn" class="btn-inline" title="Paste from Clipboard">📋</button>
                </div>
            </div>
        </div>

        <div id="sentencePreview" class="sentence-preview"></div>

        <div id="tapZone" class="tap-zone">
            Tap here to set the rhythm!
        </div>

        <div class="controls-container">
            <div class="grid-buttons">
                <button id="recordBtn">Start Recording</button>
                <button id="toFocusViewBtn" disabled>Go to Focus Mode →</button>
            </div>
            <div class="grid-buttons">
                <button id="playBtn" disabled>Test Rhythm</button>
                <button id="retryBtn">Clear / Reset</button>
            </div>
            <div id="statusSetup" class="status-text">Ready.</div>
        </div>
    </div>

    <!-- VIEW 2: STANDARD FOCUS MODE -->
    <div id="focusView" class="app-view">
        <h1>Focus Presentation Mode</h1>
        
        <div id="focusBox" class="focus-box">ーー</div>

        <label for="notesArea">Study Notes & Pinyin Window:</label>
        <textarea id="notesArea" class="notes-window" placeholder="Type structural notes..."></textarea>

        <div class="controls-container">
            <button id="toImmersiveViewBtn">Go Immersive Fullscreen Mode</button>
            <div class="grid-buttons">
                <button id="focusPlayBtn">Play Rhythm</button>
                <button id="toSetupViewBtn">← Back to Setup</button>
            </div>
            <div id="statusFocus" class="status-text">Ready.</div>
        </div>
    </div>

    <!-- VIEW 3: IMMERSIVE FULLSCREEN MODE -->
    <div id="immersiveView" class="app-view">
        <div class="immersive-top-nav">
            <button id="immToFocusBtn" class="faint-nav-btn">← Focus Mode</button>
            <button id="immToSetupBtn" class="faint-nav-btn">Setup Page ➔</button>
        </div>

        <div id="fullscreenTapArena" class="fullscreen-tap-arena">
            <div id="giantDisplayText" class="giant-display-text">TAP TO START</div>
        </div>
    </div>

</div>

<script>
    let words = [];
    let recordedTimestamps = [];
    let isArmed = false; 
    let isRecording = false;
    let currentIdx = 0;
    let startTime = 0;
    let playbackTimeoutIds = [];

    const mainContainer = document.getElementById('mainContainer');
    const setupView = document.getElementById('setupView');
    const focusView = document.getElementById('focusView');
    const immersiveView = document.getElementById('immersiveView');
    
    const sentenceInput = document.getElementById('sentenceInput');
    const sentencePreview = document.getElementById('sentencePreview');
    const notesArea = document.getElementById('notesArea');
    const clearInputBtn = document.getElementById('clearInputBtn');
    const pasteInputBtn = document.getElementById('pasteInputBtn');
    
    const recordBtn = document.getElementById('recordBtn');
    const playBtn = document.getElementById('playBtn');
    const retryBtn = document.getElementById('retryBtn');
    const toFocusViewBtn = document.getElementById('toFocusViewBtn');
    const toImmersiveViewBtn = document.getElementById('toImmersiveViewBtn');
    
    const focusBox = document.getElementById('focusBox');
    const focusPlayBtn = document.getElementById('focusPlayBtn');
    const toSetupViewBtn = document.getElementById('toSetupViewBtn');
    
    const fullscreenTapArena = document.getElementById('fullscreenTapArena');
    const giantDisplayText = document.getElementById('giantDisplayText');
    const immToFocusBtn = document.getElementById('immToFocusBtn');
    const immToSetupBtn = document.getElementById('immToSetupBtn');
    
    const tapZone = document.getElementById('tapZone');
    const statusSetup = document.getElementById('statusSetup');
    const statusFocus = document.getElementById('statusFocus');

    function formatWordDisplay(wordString) {
        return wordString.replace(/-/g, '\n');
    }

    function renderSentencePreview() {
        const text = sentenceInput.value.trim();
        words = text.split(/\s+/).filter(w => w !== "");
        
        sentencePreview.innerHTML = '';
        words.forEach((word, index) => {
            const span = document.createElement('span');
            span.className = 'preview-word';
            span.id = `word-${index}`;
            span.textContent = formatWordDisplay(word);
            sentencePreview.appendChild(span);
        });

        localStorage.setItem('savedSentence', text);
    }

    // Upgraded Scroll Engine: Proactive scrolling designed for large vertically stacked segments
    function setActiveWordAndScroll(index) {
        clearVisualHighlights();
        const activeSpan = document.getElementById(`word-${index}`);
        if (!activeSpan) return;

        activeSpan.classList.add('active');
        
        const containerHeight = sentencePreview.clientHeight;
        const elemTop = activeSpan.offsetTop;
        const elemHeight = activeSpan.clientHeight;
        
        const currentScroll = sentencePreview.scrollTop;
        
        // Triggers scroll adjustments earlier (45px clearance instead of 20px)
        const isBelowVisibleFrame = (elemTop + elemHeight) > (currentScroll + containerHeight - 45);
        const isAboveVisibleFrame = elemTop < currentScroll + 15;

        if (isBelowVisibleFrame || isAboveVisibleFrame) {
            // Centers the block instantly, taking advantage of the large inner bottom-padding cushion
            sentencePreview.scrollTop = elemTop - (containerHeight / 2) + (elemHeight / 2);
        }
    }

    function clearVisualHighlights() {
        document.querySelectorAll('.preview-word').forEach(span => span.classList.remove('active'));
    }

    function updateTextWithAutoFit(element, basicText, targetMaxFontSizeRem) {
        element.style.fontSize = targetMaxFontSizeRem + "rem";
        element.textContent = basicText;

        const lines = basicText.split('\n');
        
        const ruler = document.createElement('span');
        ruler.style.visibility = 'hidden';
        ruler.style.position = 'absolute';
        ruler.style.whiteSpace = 'nowrap';
        ruler.style.fontFamily = window.getComputedStyle(element).fontFamily;
        ruler.style.fontWeight = window.getComputedStyle(element).fontWeight;
        document.body.appendChild(ruler);

        let currentSizeRem = targetMaxFontSizeRem;
        const paddingBuffer = 45; 
        const maxAllowedWidth = element.clientWidth - paddingBuffer;

        while (currentSizeRem > 1.2) {
            ruler.style.fontSize = currentSizeRem + "rem";
            let lineOverflowDetected = false;

            for (let i = 0; i < lines.length; i++) {
                ruler.textContent = lines[i];
                if (ruler.offsetWidth > maxAllowedWidth) {
                    lineOverflowDetected = true;
                    break;
                }
            }

            if (!lineOverflowDetected) break; 
            currentSizeRem -= 0.15;
        }

        document.body.removeChild(ruler);
        element.style.fontSize = currentSizeRem + "rem";
    }

    clearInputBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sentenceInput.value = '';
        renderSentencePreview();
        statusSetup.textContent = "Input cleared.";
    });

    pasteInputBtn.addEventListener('pointerdown', async (e) => {
        e.preventDefault();
        try {
            const text = await navigator.clipboard.readText();
            sentenceInput.value = text;
            renderSentencePreview();
            sentencePreview.scrollTop = 0; 
            statusSetup.textContent = "Text pasted from clipboard successfully!";
        } catch (err) {
            statusSetup.textContent = "Could not paste text automatically.";
        }
    });

    recordBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        renderSentencePreview();
        if (words.length === 0) return;

        clearPlayback();
        clearVisualHighlights();
        sentencePreview.scrollTop = 0;

        isArmed = true;
        isRecording = false;
        recordedTimestamps = [];
        currentIdx = 0;

        recordBtn.textContent = "Waiting for 1st Tap...";
        recordBtn.className = "ready-to-tap";
        playBtn.disabled = true;
        toFocusViewBtn.disabled = true;

        tapZone.textContent = `Tap to begin -> Next: ${words[0].replace(/-/g, ' ')}`;
        statusSetup.textContent = "Timer initiates automatically at first impact.";
    });

    tapZone.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!isArmed && !isRecording) return;

        if (isArmed && !isRecording) {
            isArmed = false;
            isRecording = true;
            startTime = performance.now();
            recordBtn.textContent = "Recording...";
            recordBtn.className = "recording";
        }

        const currentTapTime = performance.now() - startTime;

        if (currentIdx < words.length) {
            recordedTimestamps.push({
                word: words[currentIdx],
                timeOffset: currentTapTime
            });

            setActiveWordAndScroll(currentIdx);
            currentIdx++;

            if (currentIdx < words.length) {
                tapZone.textContent = `Tap for: ${words[currentIdx].replace(/-/g, ' ')}`;
                statusSetup.textContent = `Logged ${currentIdx} / ${words.length}`;
            } else {
                finishRecording();
            }
        }
    });

    function finishRecording() {
        isArmed = false;
        isRecording = false;
        recordBtn.textContent = "Start Recording";
        recordBtn.className = "";
        
        if (recordedTimestamps.length > 0) {
            playBtn.disabled = false;
            toFocusViewBtn.disabled = false;
            localStorage.setItem('savedTimestamps', JSON.stringify(recordedTimestamps));
            tapZone.textContent = "Rhythm Saved Successfully!";
            statusSetup.textContent = "Ready. Move views to study.";
        }
    }

    function executePlayback(displayTarget, statusTarget, baseMaxFontRem, isSetupPreview = false) {
        clearPlayback();
        if(statusTarget) statusTarget.textContent = "Playing rhythm structure...";
        
        displayTarget.style.fontSize = baseMaxFontRem + "rem";
        displayTarget.textContent = "ーー";
        if(isSetupPreview) sentencePreview.scrollTop = 0;

        recordedTimestamps.forEach((stamp, index) => {
            let id = setTimeout(() => {
                const multiLineText = formatWordDisplay(stamp.word);
                updateTextWithAutoFit(displayTarget, multiLineText, baseMaxFontRem);
                
                if (isSetupPreview) {
                    setActiveWordAndScroll(index);
                }
                
                if (index === recordedTimestamps.length - 1) {
                    let finishId = setTimeout(() => {
                        if(statusTarget) statusTarget.textContent = "Playback complete.";
                    }, 800);
                    playbackTimeoutIds.push(finishId);
                }
            }, stamp.timeOffset);

            playbackTimeoutIds.push(id);
        });
    }

    playBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        executePlayback(focusBox, statusSetup, 3.0, true); 
    });

    focusPlayBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        executePlayback(focusBox, statusFocus, 3.0);
    });

    fullscreenTapArena.addEventListener('pointerdown', (e) => {
        if (e.target.classList.contains('faint-nav-btn')) return;
        e.preventDefault();
        executePlayback(giantDisplayText, null, 5.5);
    });

    toFocusViewBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        mainContainer.classList.remove('immersive-active');
        setupView.classList.remove('active');
        immersiveView.classList.remove('active');
        focusView.classList.add('active');
        focusBox.style.fontSize = "3rem";
        focusBox.textContent = "ーー";
    });

    toSetupViewBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        mainContainer.classList.remove('immersive-active');
        focusView.classList.remove('active');
        immersiveView.classList.remove('active');
        setupView.classList.add('active');
        clearVisualHighlights();
    });

    toImmersiveViewBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        focusView.classList.remove('active');
        setupView.classList.remove('active');
        
        mainContainer.classList.add('immersive-active');
        immersiveView.classList.add('active');
        giantDisplayText.style.fontSize = "5.5rem";
        giantDisplayText.textContent = "TAP ANYWHERE";
    });

    immToFocusBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        mainContainer.classList.remove('immersive-active');
        immersiveView.classList.remove('active');
        focusView.classList.add('active');
        focusBox.style.fontSize = "3rem";
        focusBox.textContent = "ーー";
    });

    immToSetupBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        mainContainer.classList.remove('immersive-active');
        immersiveView.classList.remove('active');
        setupView.classList.add('active');
        clearVisualHighlights();
    });

    notesArea.addEventListener('input', () => {
        localStorage.setItem('savedNotes', notesArea.value);
    });

    retryBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearPlayback();
        clearVisualHighlights();
        isArmed = false;
        isRecording = false;
        recordedTimestamps = [];
        currentIdx = 0;
        
        recordBtn.textContent = "Start Recording";
        recordBtn.className = "";
        playBtn.disabled = true;
        toFocusViewBtn.disabled = true;
        
        tapZone.textContent = "Tap here to set the rhythm!";
        statusSetup.textContent = "Reset tracking values complete.";
        renderSentencePreview();
    });

    function clearPlayback() {
        playbackTimeoutIds.forEach(id => clearTimeout(id));
        playbackTimeoutIds = [];
    }

    sentenceInput.addEventListener('input', renderSentencePreview);

    window.addEventListener('DOMContentLoaded', () => {
        const storedSentence = localStorage.getItem('savedSentence');
        const storedTimestamps = localStorage.getItem('savedTimestamps');
        const savedNotes = localStorage.getItem('savedNotes');

        if (storedSentence) sentenceInput.value = storedSentence;
        if (savedNotes) notesArea.value = savedNotes;
        
        renderSentencePreview();

        if (storedTimestamps) {
            recordedTimestamps = JSON.parse(storedTimestamps);
            if (recordedTimestamps.length > 0) {
                playBtn.disabled = false;
                toFocusViewBtn.disabled = false;
                statusSetup.textContent = "Loaded last profile configurations safely.";
            }
        }
    });
</script>

</body>
</html>
